
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizForge | Student Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 390px;
      padding: 30px;
      background: #111e30;
      border: 1px solid #263750;
      border-radius: 16px;
    }

    h1 {
      color: #4f8cff;
      text-align: center;
    }

    p {
      text-align: center;
      color: #aab8cc;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      background: #07111f;
      color: white;
      border: 1px solid #34445c;
    }

    button {
      background: #4f8cff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      overflow-wrap: anywhere;
      font-size: 14px;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>QuizForge</h1>
    <p>Login or create your student account</p>

    <form id="authForm">
      <input
        type="email"
        id="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password (minimum 6 characters)"
        autocomplete="current-password"
        minlength="6"
        required
      >

      <button type="submit" id="loginBtn">Login</button>
      <button type="button" id="signupBtn">Create Account</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </div>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    // Replace these with your own Supabase details.
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");

    function showMessage(text) {
      message.textContent = text;
    }

    async function authenticate(mode) {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || password.length < 6) {
        showMessage("Enter a valid email and password of at least 6 characters.");
        return;
      }

      loginBtn.disabled = true;
      signupBtn.disabled = true;
      showMessage("Please wait...");

      try {
        let result;

        if (mode === "signup") {
          result = await supabase.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: window.location.origin + "/login.html"
            }
          });
        } else {
          result = await supabase.auth.signInWithPassword({
            email,
            password
          });
        }

        if (result.error) {
          throw result.error;
        }

        if (mode === "signup" && !result.data.session) {
          showMessage("Account created! Check your email to confirm your account, then log in.");
          return;
        }

        showMessage("Login successful! Opening QuizForge...");

        window.location.replace("/index.html");
      } catch (error) {
        showMessage(error.message || "Something went wrong.");
      } finally {
        loginBtn.disabled = false;
        signupBtn.disabled = false;
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      authenticate("login");
    });

    signupBtn.addEventListener("click", () => {
      authenticate("signup");
    });

    // If already logged in, continue to the main page.
    const { data } = await supabase.auth.getSession();

    if (data.session) {
      window.location.replace("/index.html");
    }
  </script>
</body>
</html>
